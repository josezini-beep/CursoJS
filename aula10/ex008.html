<!DOCTYPE html>
<html lang='pt-br'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Somando valore</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <h1>Somando valores</h1>
    <input type="number" name="textonumero1" id="txtn1">
    <input type="number" name="textonumero2" id="txtn2">
    <input type="button" value="Somar" onclick="somar()">
    <div id="res">Resultado</div>
    <script>
        function somar(){
            var txtn1 = window.document.getElementById('txtn1')
            var txtn2 = window.document.querySelector('input#txtn2')
            var res = window.document.getElementById('res')
            var n1 = Number(txtn1.value)
            var n2 = Number(txtn2.value)
            var s= n1+n2
            res.innerHTML=`a soma entre ${n1} e ${n2} é ${s}`
        }
    </script>

</body>
</html>
