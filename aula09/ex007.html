<!DOCTYPE html>
<html lang='pt-br'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <h1>Operadores parte 2</h1>
    <p id="operadores"></p>

    <script>
        var n1 = 5;
        var n2 = 2;
        var resultado = n1 > n2; // Retorna true
        var resultado2 = n2 > n1 ? 'ss' : 'falso';

        // Escreve o resultado dentro do elemento com id="operadores"
        document.getElementById('operadores').innerText = `O resultado de ${n1} > ${n2} é: ${resultado} ${resultado2}`
    </script>
</body>
</html>
