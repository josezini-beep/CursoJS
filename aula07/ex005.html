<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exemplo 5</title>
</head>

<body>

    <h1>Resultados</h1>
    <p id="resultado"></p>

    <script>
        var n = 4;

        var soma = n + 2;
        var menos = n - 2;
        var divisao = n / 2;
        var multiplicacao = n * 2;
        var resto = n % 2;
        var exponente = n ** 2;

        document.getElementById("resultado").innerHTML =
            "Soma: " + soma + "<br>" +
            "Subtração: " + menos + "<br>" +
            "Divisão: " + divisao + "<br>" +
            "Multiplicação: " + multiplicacao + "<br>" +
            "Resto da divisão: " + resto + "<br>" +
            "Exponente: " + exponente;
    </script>

</body>
</html>
